<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DabiDabi Randomizer</title>
<style>
:root{--bg:#07080c;--panel:#11131a;--line:#292d38;--muted:#858995;--text:#f4f4f5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;justify-content:center}
.app{width:min(620px,100%);padding:18px 0 30px}.brand{text-align:center;font-size:22px;font-weight:900;letter-spacing:4px}.sub{text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px;margin:5px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.wheel{width:min(82vw,430px);height:min(82vw,430px);margin:4px auto 14px;border-radius:50%;border:8px solid #30343e;background:conic-gradient(#171a22 0 25%,#282c35 25% 50%,#151820 50% 75%,#242831 75% 100%);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 3px #090a0e,0 0 40px #000}
.wheel:after{content:"D";font-size:110px;font-weight:900;opacity:.08}.pointer{position:absolute;top:-17px;left:50%;transform:translateX(-50%);border-left:17px solid transparent;border-right:17px solid transparent;border-top:35px solid #eee;z-index:2}
.result{min-height:82px;border:1px solid var(--line);border-radius:13px;background:#0b0c11;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:900;padding:12px}.result small{display:block;color:var(--muted);font-size:10px;letter-spacing:3px;margin-bottom:6px}
button{appearance:none;border:0;border-radius:12px;background:#e9e9eb;color:#08090d;font-weight:900;padding:13px 15px;font-size:15px;touch-action:manipulation}.spin{width:100%;font-size:20px;letter-spacing:2px;margin-top:12px}.spin:disabled{opacity:.35}.dark{background:#292d37;color:#eee}.danger{background:#382027;color:#eee}
.row{display:flex;gap:8px}.row button{flex:1}label{display:block;color:#a0a4ae;font-size:11px;letter-spacing:1px;margin:12px 0 6px}input,textarea{width:100%;background:#0b0c11;color:#eee;border:1px solid #30343e;border-radius:10px;padding:11px;font:inherit;font-size:16px}textarea{height:145px;resize:vertical}.stats{display:flex;justify-content:space-between;margin-top:14px;color:#aeb2bc}.history{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;max-height:180px;overflow:auto;font-size:14px;color:#c2c4ca}.history div{padding:4px 0}.hint{color:#747985;font-size:11px;line-height:1.45}
@keyframes spin{to{transform:rotate(1620deg)}}.spinning{animation:spin 2.2s cubic-bezier(.12,.78,.18,1)}
</style>
</head>
<body><main class="app">
<div class="brand">DABIDABI UNIVERSAL</div><div class="sub">RANDOMIZER // DRAFT ENGINE</div>

<section class="card">
<div class="wheel" id="wheel"><div class="pointer"></div></div>
<div class="result" id="result"><div><small>READY</small>Пул готов</div></div>
<button class="spin" id="spin" type="button">SPIN</button>
<div class="row" style="margin-top:8px"><button class="dark" id="undo" type="button">UNDO</button><button class="dark" id="reset" type="button">RESET</button></div>
</section>

<section class="card">
<label>РЕЖИМ</label>
<div class="row"><button class="dark" id="rangeMode" type="button">1 → N</button><button class="dark" id="listMode" type="button">СПИСОК</button></div>
<div id="rangeBox"><label>ОТ</label><input id="from" type="number" value="1" inputmode="numeric"><label>ДО</label><input id="to" type="number" value="200" inputmode="numeric"></div>
<div id="listBox" style="display:none"><label>УЧАСТНИКИ — ПО ОДНОМУ В СТРОКЕ</label><textarea id="list" placeholder="Randy Orton&#10;AJ Styles&#10;Ric Flair"></textarea></div>
<label>ПРАВИЛО</label>
<div><input id="remove" type="checkbox" checked style="width:auto;vertical-align:middle"> Удалять выпавший вариант</div>
<div class="stats"><span>В пуле: <b id="left">0</b></span><span>Выпало: <b id="drawn">0</b></span></div>
<label>ИСТОРИЯ</label><div class="history" id="history"></div>
<p class="hint">Для Draft оставляем удаление включённым: выпавший номер больше не может выпасть повторно.</p>
</section>
</main>
<script>
(function(){
let mode="range",pool=[],history=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]));
function build(){
 pool=[];
 if(mode==="range"){
   const a=Number($("from").value),b=Number($("to").value);
   if(!Number.isFinite(a)||!Number.isFinite(b)||b<a){render();return;}
   for(let i=a;i<=b;i++)pool.push(String(i));
 }else{
   pool=$("list").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 }
 history=[];render();$("result").innerHTML="<div><small>READY</small>Пул готов</div>";
}
function render(){
 $("left").textContent=pool.length;$("drawn").textContent=history.length;
 $("history").innerHTML=history.slice().reverse().map((x,i)=>"<div><b>#"+(history.length-i)+"</b> — "+esc(x)+"</div>").join("");
}
$("spin").addEventListener("click",function(){
 if(!pool.length){$("result").innerHTML="<div><small>EMPTY</small>Пул пуст</div>";return;}
 $("spin").disabled=true;$("wheel").classList.remove("spinning");void $("wheel").offsetWidth;$("wheel").classList.add("spinning");
 setTimeout(function(){
   const i=Math.floor(Math.random()*pool.length),v=pool[i];history.push(v);
   if($("remove").checked)pool.splice(i,1);
   $("result").innerHTML="<div><small>RESULT</small>"+esc(v)+"</div>";render();$("spin").disabled=false;
 },2200);
});
$("undo").addEventListener("click",function(){if(!history.length)return;const v=history.pop();pool.push(v);render();$("result").innerHTML="<div><small>UNDO</small>"+esc(v)+" возвращён</div>";});
$("reset").addEventListener("click",build);
$("rangeMode").addEventListener("click",function(){mode="range";$("rangeBox").style.display="block";$("listBox").style.display="none";build();});
$("listMode").addEventListener("click",function(){mode="list";$("rangeBox").style.display="none";$("listBox").style.display="block";build();});
$("from").addEventListener("change",build);$("to").addEventListener("change",build);$("list").addEventListener("change",build);
build();
})();
</script>
</body></html>
